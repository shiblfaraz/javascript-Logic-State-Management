<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Interactive To-Do List application built using HTML, CSS and JavaScript">

    <title>To-Do List | Thiranx Internship</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-container">

        <header class="todo-header">
            <h1>My To-Do List</h1>
            <p>Organize your tasks and stay productive.</p>
        </header>

        <section class="todo-input-section">

            <form id="todo-form">

                <input
                    type="text"
                    id="todo-input"
                    placeholder="Enter a task..."
                    aria-label="Enter a new task"
                    autocomplete="off"
                    required
                >

                <button type="submit" aria-label="Add task">
                    Add Task
                </button>

            </form>

        </section>

        <section class="todo-controls">

            <div class="filters" aria-label="Task filters">

                <button
                    class="filter-btn active"
                    data-filter="all"
                    type="button">
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="active"
                    type="button">
                    Active
                </button>

                <button
                    class="filter-btn"
                    data-filter="completed"
                    type="button">
                    Completed
                </button>

            </div>

            <button
                id="clear-completed"
                type="button">
                Clear Completed
            </button>

        </section>

        <section>

            <ul
                id="todo-list"
                class="todo-list"
                aria-live="polite">
            </ul>

            <p id="empty-message" class="empty-message">
                No tasks yet. Add your first task!
            </p>

        </section>

        <footer class="todo-footer">

            <span id="task-count">
                0 tasks remaining
            </span>

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
